<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiln</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #14110e;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #14110e;
        touch-action: none;
      }
      canvas:focus { outline: none; }
      canvas:focus-visible {
        outline: 2px solid #6e8b74;
        outline-offset: 6px;
      }
      .touch {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px;
        gap: 8px;
        grid-template-columns: 1fr 1fr 1fr;
      }
      .touch button {
        font: 700 13px "Courier New", ui-monospace, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffd27a;
        background: #241c18;
        border: 3px solid #5c261c;
        min-height: 56px;
        border-radius: 0;
      }
      .touch button:active,
      .touch button:focus-visible {
        background: #5c261c;
        color: #fff6e8;
        outline: none;
      }
      @media (pointer: coarse) {
        .touch { display: grid; }
        body { place-items: start center; padding-top: 12px; }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="320" height="240" tabindex="0" aria-label="Kiln. Arrows move, Z or space jumps, X sets a brick, R restarts."></canvas>
    <p id="status" class="sr-only" aria-live="polite">Kiln.</p>
    <div class="touch">
      <button type="button" data-k="up">Up</button>
      <button type="button" data-k="down">Down</button>
      <button type="button" data-k="jump">Jump</button>
      <button type="button" data-k="left">Left</button>
      <button type="button" data-k="right">Right</button>
      <button type="button" data-k="place">Brick</button>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
