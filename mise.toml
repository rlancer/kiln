min_version = "2026.8.1"

[tools]
bun = "1.4.3"

[tasks.dev]
description = "Run the Kiln dev server"
run = "bun run dev"

[tasks.start]
description = "Serve Kiln"
run = "bun run start"

[tasks.test]
description = "Run simulation tests"
run = "bun test"

[tasks.build]
description = "Build the static site into dist/"
run = "bun run build"

[tasks.typecheck]
description = "Typecheck the game"
run = "bun run typecheck"
